<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #1 {
      display: flex;
      width: 100%;
      height: calc(100vh * 2); /* 修正计算 */
      flex-flow: column nowrap;
      align-items: center;
      justify-content: center;
      background-color: aquamarine;
    }

    #2 {
      height: 100vh;
      width: 100%;
      display: flex;
    }

    #3 {
      height: 100vh;
      width: 100%;
      display: flex;
    }

    #4 {
      display: flex;
      position: absolute;
      width: 200px;
      height: 200px;
      background: red;
    }
  </style>
</head>
<body>
  <div id="1">
    <div id="2"></div>
    <div id="3">
      <div id="4"></div> <!-- 修正自闭合标签 -->
    </div>
  </div>
</body>
</html>
